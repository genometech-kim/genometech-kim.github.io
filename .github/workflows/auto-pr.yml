name: Auto PR to develop

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR to develop (if not already open)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base develop --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "이미 열린 PR이 있어 건너뜁니다."
            exit 0
          fi

          title=$(git log -1 --pretty=%s)
          gh pr create \
            --base develop \
            --head "${{ github.ref_name }}" \
            --title "$title" \
            --body "자동으로 생성된 PR입니다. 내용을 확인하고 필요하면 제목/설명을 수정해주세요."
