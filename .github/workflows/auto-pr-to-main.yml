name: Auto version bump + PR to main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version (patch, rolling over to minor at 10)
        id: bump
        run: |
          current=$(jq -r .version package.json)
          IFS='.' read -r major minor patch <<< "$current"

          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then
            patch=0
            minor=$((minor + 1))
          fi
          new_version="$major.$minor.$patch"

          jq --arg v "$new_version" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin develop

      - name: Open PR to main (if not already open)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "이미 열린 PR이 있어 건너뜁니다."
            exit 0
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "Release: v${{ steps.bump.outputs.version }}" \
            --body "자동으로 생성된 배포용 PR입니다. 병합 전 변경 내역을 확인해주세요."
